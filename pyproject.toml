[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeskui"
version = "0.2.0"
description = "Professional Tk 9 desktop components with native SVG rendering"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "openHacking"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/openHacking/PyDeskUI"
Issues = "https://github.com/openHacking/PyDeskUI/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6", "pytest>=8", "ruff>=0.12", "mypy>=1.15"]
docs = ["sphinx>=8", "myst-parser>=4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pydeskui", "pydeskui.widgets"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
pydeskui = ["py.typed", "locales/**/*.mo", "assets/icons/*.svg"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
files = ["src/pydeskui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

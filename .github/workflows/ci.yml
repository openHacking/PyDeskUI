name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Official 3.13 installers still bundle Tk 8.6 on some platforms.
        # Python 3.13 + Tk 9 is covered by the recorded local release run.
        python: ['3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Require Tk 9
        run: python -c "import tkinter as tk; r=tk.Tk(); v=r.tk.call('package','require','Tk'); print('Tk',v); assert int(r.tk.call('package','vcompare',v,'9.0')) >= 0; r.destroy()"
      - run: python -m pip install -e '.[dev,docs]'
      - run: python scripts/compile_catalogs.py
      - run: ruff check src tests examples scripts
      - run: mypy
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: sphinx-build -W -b html docs build/docs
      - run: python scripts/check_wheel.py
